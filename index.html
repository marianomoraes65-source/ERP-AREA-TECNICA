<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Sing Pro | PCP & Engenharia</title>
    
    <!-- Bibliotecas Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --primary: #009ef7; --dark: #0f172a; --bg-light: #f8fafc; 
        }
        body { height: 100vh; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1e293b; display: flex; flex-direction: column; }
        
        /* Layout e Tabs */
        .os-titlebar { height: 40px; background: var(--dark); color: #94a3b8; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #334155; }
        .browser-tabs { background: var(--dark); display: flex; padding: 6px 12px 0 12px; gap: 4px; overflow-x: auto; border-bottom: 3px solid var(--primary); }
        .b-tab { background: #334155; color: #cbd5e1; padding: 9px 18px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: 0.2s; }
        .b-tab.active { background: var(--bg-light); color: var(--primary); }
        .global-toolbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 10px 20px; display: flex; align-items: center; gap: 15px; }

        #screens-container { display: flex; flex: 1; overflow: hidden; background: #cbd5e1; }
        .app-screen { display: none; background: var(--bg-light); height: 100%; flex-direction: column; overflow-y: auto; flex: 1; padding: 20px; }
        .app-screen.active { display: flex; }
        
        /* Tabelas */
        .table-inline-input { border: 1px solid transparent; background: transparent; padding: 2px 5px; font-size: 0.85rem; width: 100%; border-radius: 4px; }
        .table-inline-input:focus { border-color: var(--primary); background: #ffffff; outline: none; }

        /* Estilo Etiquetas para Impressão */
        @media print {
            body * { visibility: hidden; }
            #print-section, #print-section * { visibility: visible; }
            #print-section { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
            .no-print { display: none !important; }
            .etiqueta {
                width: 10cm; height: 5cm; border: 1px solid #000; margin-bottom: 0.2cm;
                padding: 10px; box-sizing: border-box; display: flex; flex-direction: column;
                page-break-after: always;
            }
        }

        #ai-loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 10000; align-items: center; justify-content: center; flex-direction: column; color: white; }
    </style>
</head>
<body>

    <div id="ai-loader">
        <div class="spinner-border text-info"></div>
        <h4 class="mt-3">Sincronizando com Supabase...</h4>
    </div>

    <!-- Container de Impressão -->
    <div id="print-section" class="d-none"></div>

    <div class="os-titlebar">
        <span><i class="bi bi-cpu-fill text-info me-2"></i>M-SING PRO</span>
        <small id="status-db" class="text-success"><i class="bi bi-cloud-check"></i> Nuvem Ativa</small>
    </div>

    <div class="browser-tabs">
        <div class="b-tab active" onclick="abrirAba('dashboard')">PCP</div>
        <div class="b-tab" onclick="abrirAba('editor')">1. Contrato</div>
        <div class="b-tab" onclick="abrirAba('fiscal')">2. Fiscal</div>
        <div class="b-tab" onclick="abrirAba('engenharia')">3. Engenharia</div>
        <div class="b-tab" onclick="abrirAba('relatorios')">4. O.P & Etiquetas</div>
    </div>

    <div class="global-toolbar">
        <select id="projetoSelector" class="form-select border-primary fw-bold" style="width: 300px;" onchange="mudarProjeto(this.value)"></select>
        <button class="btn btn-sm btn-outline-primary" onclick="novaObra()">+ Nova Obra</button>
    </div>

    <div id="screens-container">
        
        <!-- DASHBOARD -->
        <div id="screen-dashboard" class="app-screen active">
            <h4 class="fw-bold mb-4">Dashboard PCP</h4>
            <div id="kanbanContainer" class="row g-3"></div>
        </div>

        <!-- EDITOR DE CONTRATO -->
        <div id="screen-editor" class="app-screen">
            <div class="d-flex justify-content-between mb-3">
                <h4 class="fw-bold">Itens do Contrato</h4>
                <button class="btn btn-sm btn-primary" onclick="addItem()">+ Adicionar Item</button>
            </div>
            <div class="card border-0 shadow-sm">
                <table class="table table-sm table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>TAG</th><th>Tipologia</th><th>L</th><th>H</th><th>Qtd</th><th>Cor</th><th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="editorTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- FISCAL -->
        <div id="screen-fiscal" class="app-screen">
            <h4 class="fw-bold mb-3">Medição de Obra</h4>
            <div class="card border-0 shadow-sm">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>TAG</th><th>Saldo</th><th>L Real</th><th>H Real</th><th>Qtd Lib.</th><th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="fiscalTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ENGENHARIA -->
        <div id="screen-engenharia" class="app-screen">
            <div class="d-flex justify-content-between mb-3">
                <h4 class="fw-bold">Fila de Engenharia</h4>
                <div class="d-flex gap-2">
                    <input type="text" id="opNomeInput" class="form-control form-control-sm" placeholder="Nome da O.P.">
                    <button class="btn btn-sm btn-success" onclick="gerarOP()">Gerar O.P.</button>
                </div>
            </div>
            <div class="card border-0 shadow-sm">
                <table class="table table-hover mb-0">
                    <tbody id="engTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- RELATORIOS -->
        <div id="screen-relatorios" class="app-screen">
            <h4 class="fw-bold mb-3">Histórico de O.Ps</h4>
            <div id="opsContainer" class="row g-3"></div>
        </div>

    </div>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SB_URL = 'https://jlplzxgojefbwohjhyuu.supabase.co';
        const SB_KEY = 'sb_publishable_Ec0zb3yQF48_VMNOcB5_vw_vcEVwcXb';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let db_projetos = [];
        let db_itens = [];
        let idAtivo = null;

        window.onload = async () => {
            await carregarObras();
        };

        async function carregarObras() {
            const { data } = await _supabase.from('obras').select('*').order('created_at', {ascending: false});
            db_projetos = data || [];
            const sel = document.getElementById('projetoSelector');
            sel.innerHTML = db_projetos.map(p => `<option value="${p.id}">${p.codigo} - ${p.nome}</option>`).join('');
            if(db_projetos.length > 0) mudarProjeto(db_projetos[0].id);
        }

        async function mudarProjeto(id) {
            idAtivo = id;
            document.getElementById('ai-loader').style.display = 'flex';
            const { data } = await _supabase.from('itens').select('*').eq('obra_id', id).order('tag');
            db_itens = data || [];
            atualizarTelas();
            document.getElementById('ai-loader').style.display = 'none';
        }

        function atualizarTelas() {
            renderEditor();
            renderFiscal();
            renderEngenharia();
            renderDashboard();
            renderOPs();
        }

        // --- FUNÇÕES DE INTERFACE ---
        function abrirAba(id) {
            document.querySelectorAll('.b-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('screen-'+id).classList.add('active');
        }

        function renderEditor() {
            const tbody = document.getElementById('editorTableBody');
            tbody.innerHTML = db_itens.map(i => `
                <tr>
                    <td><input class="table-inline-input fw-bold" value="${i.tag}" onblur="saveItem('${i.id}', 'tag', this.value)"></td>
                    <td><input class="table-inline-input" value="${i.cod}" onblur="saveItem('${i.id}', 'cod', this.value)"></td>
                    <td><input class="table-inline-input" type="number" value="${i.l}" onblur="saveItem('${i.id}', 'l', this.value)"></td>
                    <td><input class="table-inline-input" type="number" value="${i.h}" onblur="saveItem('${i.id}', 'h', this.value)"></td>
                    <td><input class="table-inline-input" type="number" value="${i.qtd_c}" onblur="saveItem('${i.id}', 'qtd_c', this.value)"></td>
                    <td><input class="table-inline-input" value="${i.cor}" onblur="saveItem('${i.id}', 'cor', this.value)"></td>
                    <td><button class="btn btn-sm" onclick="delItem('${i.id}')">❌</button></td>
                </tr>
            `).join('');
        }

        async function saveItem(id, campo, valor) {
            await _supabase.from('itens').update({ [campo]: valor }).eq('id', id);
        }

        async function addItem() {
            await _supabase.from('itens').insert([{ obra_id: idAtivo, tag: 'NOVA', cod: 'TIPOLOGIA', l: 1000, h: 1000 }]);
            mudarProjeto(idAtivo);
        }

        function renderFiscal() {
            const tbody = document.getElementById('fiscalTableBody');
            tbody.innerHTML = db_itens.map(i => `
                <tr>
                    <td class="fw-bold">${i.tag}</td>
                    <td class="text-danger fw-bold">${i.qtd_c - i.qtd_l}</td>
                    <td><input type="number" class="form-control form-control-sm" id="l_r_${i.id}" value="${i.l_r || i.l}"></td>
                    <td><input type="number" class="form-control form-control-sm" id="h_r_${i.id}" value="${i.h_r || i.h}"></td>
                    <td><input type="number" class="form-control form-control-sm border-primary" id="q_l_${i.id}" placeholder="0"></td>
                    <td><button class="btn btn-sm btn-success" onclick="liberar('${i.id}')">Liberar</button></td>
                </tr>
            `).join('');
        }

        async function liberar(id) {
            const q = parseInt(document.getElementById('q_l_'+id).value) || 0;
            const item = db_itens.find(x => x.id === id);
            await _supabase.from('itens').update({
                qtd_l: item.qtd_l + q,
                l_r: document.getElementById('l_r_'+id).value,
                h_r: document.getElementById('h_r_'+id).value
            }).eq('id', id);
            mudarProjeto(idAtivo);
        }

        function renderEngenharia() {
            const tbody = document.getElementById('engTableBody');
            tbody.innerHTML = db_itens.filter(i => (i.qtd_l - i.qtd_op) > 0).map(i => `
                <tr>
                    <td><input type="checkbox" class="op-check" value="${i.id}"></td>
                    <td>${i.tag}</td>
                    <td>${i.l_r} x ${i.h_r}</td>
                    <td class="fw-bold text-primary">Fila: ${i.qtd_l - i.qtd_op} pçs</td>
                </tr>
            `).join('');
        }

        async function gerarOP() {
            const checks = document.querySelectorAll('.op-check:checked');
            const itensOP = [];
            for (let c of checks) {
                const item = db_itens.find(x => x.id === c.value);
                const qtdPendente = item.qtd_l - item.qtd_op;
                itensOP.push({...item, qtd_na_op: qtdPendente});
                await _supabase.from('itens').update({ qtd_op: item.qtd_op + qtdPendente }).eq('id', item.id);
            }
            await _supabase.from('ordens_producao').insert([{
                nome: document.getElementById('opNomeInput').value || 'OP-Geral',
                obra_id: idAtivo,
                itens_json: itensOP
            }]);
            mudarProjeto(idAtivo);
        }

        async function renderOPs() {
            const { data } = await _supabase.from('ordens_producao').select('*').eq('obra_id', idAtivo).order('data', {ascending:false});
            const container = document.getElementById('opsContainer');
            container.innerHTML = (data || []).map(op => `
                <div class="col-md-4">
                    <div class="card p-3 shadow-sm border-primary">
                        <h6 class="fw-bold">${op.nome}</h6>
                        <small>${new Date(op.data).toLocaleDateString()}</small>
                        <button class="btn btn-sm btn-dark mt-2" onclick="imprimir('${op.id}')">Imprimir Etiquetas</button>
                    </div>
                </div>
            `).join('');
        }

        async function imprimir(opId) {
            const { data } = await _supabase.from('ordens_producao').select('*').eq('id', opId).single();
            const printArea = document.getElementById('print-section');
            printArea.innerHTML = '';
            data.itens_json.forEach(item => {
                for(let i=1; i<=item.qtd_na_op; i++) {
                    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=TAG:${item.tag}|DIM:${item.l_r}x${item.h_r}`;
                    printArea.innerHTML += `
                        <div class="etiqueta">
                            <div style="font-size:24px; font-weight:bold">${item.tag}</div>
                            <div style="font-size:18px">${item.l_r} x ${item.h_r}</div>
                            <div style="display:flex; justify-content:space-between">
                                <span>${item.cor}</span>
                                <img src="${qr}" style="width:60px">
                            </div>
                        </div>
                    `;
                }
            });
            window.print();
        }

        function renderDashboard() {
            const container = document.getElementById('kanbanContainer');
            const total = db_itens.reduce((a,b) => a + b.qtd_c, 0);
            const lib = db_itens.reduce((a,b) => a + b.qtd_l, 0);
            const op = db_itens.reduce((a,b) => a + b.qtd_op, 0);
            const pLib = Math.round((lib/total)*100) || 0;
            const pOp = Math.round((op/total)*100) || 0;

            container.innerHTML = `
                <div class="col-md-6">
                    <div class="card p-4 shadow-sm">
                        <h5>Progresso de Medição: ${pLib}%</h5>
                        <div class="progress mt-2"><div class="progress-bar bg-success" style="width:${pLib}%"></div></div>
                        <h5 class="mt-4">Progresso de Produção: ${pOp}%</h5>
                        <div class="progress mt-2"><div class="progress-bar" style="width:${pOp}%"></div></div>
                    </div>
                </div>
            `;
        }

        async function novaObra() {
            const cod = prompt("Código da Obra (ex: RBG 26-0001):");
            const nome = prompt("Nome da Obra:");
            if(cod && nome) {
                await _supabase.from('obras').insert([{codigo: cod, nome: nome, projetista: 'Engenharia'}]);
                carregarObras();
            }
        }
    </script>
</body>
</html>
